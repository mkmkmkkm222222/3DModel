<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Unit 3D — PT. GUNINDO TRIMUKTI (MATSUYAMA)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-light: #f4f6fb;
    --panel-bg: #ffffff;
    --panel-raised: #f8fafc;
    --glass-border: rgba(37, 99, 235, 0.12);
    --glass-border-hover: rgba(37, 99, 235, 0.35);
    
    --blue-main: #1d4ed8;
    --blue-accent: #2563eb;
    --cyan-glow: #0891b2;
    --purple-accent: #7c3aed;
    
    --ink-primary: #0f172a;
    --ink-secondary: #475569;
    --ink-muted: #94a3b8;
    
    --accent-gold: #d97706;
    --ok: #059669;
    
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
    
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
  }

  * { box-sizing: inherit; }
  
  html, body { 
    height: 100%; 
    margin: 0; 
    background-color: var(--bg-light); 
    color: var(--ink-primary);
    overflow-x: hidden;
  }

  body { 
    display: flex; 
    flex-direction: column; 
    min-height: 100vh;
    position: relative;
    background-image: 
      radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(124, 58, 237, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(8, 145, 178, 0.08) 0%, transparent 60%);
    background-attachment: fixed;
  }

  /* Decorative Ambient Blobs */
  .ambient-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: -1;
    opacity: 0.6;
    pointer-events: none;
    animation: float 18s infinite ease-in-out alternate;
  }
  .blob-1 { top: -80px; left: -80px; width: 400px; height: 400px; background: rgba(59, 130, 246, 0.2); }
  .blob-2 { bottom: -80px; right: -80px; width: 450px; height: 450px; background: rgba(139, 92, 246, 0.15); animation-delay: -5s; }
  .blob-3 { top: 45%; left: 35%; width: 300px; height: 300px; background: rgba(6, 182, 212, 0.12); animation-delay: -9s; }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, 20px) scale(1.05); }
    100% { transform: translate(-20px, 40px) scale(0.95); }
  }

  /* Topbar Styling */
  .topbar { 
    padding: 16px 32px; 
    border-bottom: 1px solid var(--glass-border); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    background: rgba(255, 255, 255, 0.8); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
  }

  .brand-container {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* 3D Icon Badge */
  .logo-3d {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #7c3aed 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
      0 8px 20px rgba(37, 99, 235, 0.3),
      inset 0 2px 3px rgba(255, 255, 255, 0.5),
      inset 0 -3px 6px rgba(0, 0, 0, 0.2);
    position: relative;
    transform: perspective(400px) rotateX(10deg) rotateY(-10deg);
    transition: transform 0.3s ease;
  }
  .logo-3d:hover {
    transform: perspective(400px) rotateX(0deg) rotateY(0deg) scale(1.05);
  }
  .logo-3d-text {
    font-weight: 800;
    font-size: 13px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    letter-spacing: -0.5px;
  }

  .brand-info { display: flex; flex-direction: column; }
  .brand-title { font-size: 16px; font-weight: 700; color: var(--ink-primary); letter-spacing: -0.2px; }
  .brand-title span { background: linear-gradient(90deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-subtitle { font-size: 10px; color: var(--ink-secondary); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }

  .conn-status { 
    font-family: 'JetBrains Mono', monospace; 
    font-size: 12px; 
    color: var(--ink-secondary); 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    background: rgba(255, 255, 255, 0.9);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .conn-dot { 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    background: #dc2626; 
    box-shadow: 0 0 8px #dc2626;
  }
  .conn-dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .conn-dot.pending { background: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); animation: pulse 1.5s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Main Layout Full Width */
  main { flex: 1 1 auto; overflow-y: auto; padding: 28px 32px; max-width: 1400px; width: 100%; margin: 0 auto; }
  @media (max-width: 768px) { main { padding: 16px; } }

  .card-container-wrapper { 
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); 
    border-radius: var(--radius-lg); 
    padding: 24px; 
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.06);
  }

  /* Toolbar */
  .toolbar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .search-box { flex: 1 1 280px; background: #ffffff; border: 1px solid #cbd5e1; color: var(--ink-primary); padding: 11px 14px; border-radius: var(--radius-md); font-size: 13.5px; outline: none; transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
  .search-box:focus { border-color: var(--blue-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  
  .btn-refresh { background: #f1f5f9; color: var(--ink-secondary); border: 1px solid #cbd5e1; padding: 11px 16px; border-radius: var(--radius-md); font-weight: 600; font-size: 13.5px; cursor: pointer; transition: all 0.2s ease; }
  .btn-refresh:hover { background: #e2e8f0; color: var(--ink-primary); border-color: #94a3b8; }
  
  .stat { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--blue-main); background: rgba(37, 99, 235, 0.08); padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid rgba(37, 99, 235, 0.2); font-weight: 600; }

  /* Unit Cards Grid Layout */
  .units-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }

  .unit-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-md);
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    position: relative;
    overflow: hidden;
  }

  .unit-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: linear-gradient(to bottom, var(--blue-accent), var(--purple-accent));
    opacity: 0.8;
  }

  .unit-card:hover {
    transform: translateY(-3px);
    border-color: var(--blue-accent);
    box-shadow: 0 10px 20px rgba(37, 99, 235, 0.1);
  }

  .unit-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .unit-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--blue-main);
    font-weight: 700;
  }

  .unit-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-primary);
    margin-top: 4px;
    line-height: 1.3;
  }

  .unit-url-box {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-muted);
    background: var(--panel-raised);
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid #e2e8f0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .unit-footer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid #f1f5f9;
    padding-top: 12px;
  }

  .btn-action-group {
    display: flex;
    gap: 8px;
  }

  .btn-open {
    background: linear-gradient(135deg, var(--blue-accent) 0%, var(--purple-accent) 100%);
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }
  .btn-open:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .btn-share { 
    background: rgba(37, 99, 235, 0.08); 
    border: 1px solid rgba(37, 99, 235, 0.25); 
    color: var(--blue-accent); 
    cursor: pointer; 
    font-size: 13px; 
    font-weight: 600;
    padding: 9px 14px; 
    border-radius: var(--radius-sm); 
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }
  .btn-share:hover { 
    background: var(--blue-accent); 
    color: #fff; 
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }
  
  .badge { 
    font-family: 'JetBrains Mono', monospace; 
    font-size: 11px; 
    padding: 3px 10px; 
    border-radius: 12px; 
    background: rgba(124, 58, 237, 0.08); 
    border: 1px solid rgba(124, 58, 237, 0.2); 
    color: #7c3aed; 
    font-weight: 600;
  }

  /* Toast Notification */
  .toast { 
    position: fixed; 
    bottom: 24px; 
    left: 50%; 
    transform: translateX(-50%) translateY(20px); 
    background: rgba(15, 23, 42, 0.92); 
    backdrop-filter: blur(12px);
    border: 1px solid var(--blue-accent); 
    color: #fff;
    padding: 12px 22px; 
    border-radius: 30px; 
    font-size: 13.5px; 
    font-weight: 500;
    opacity: 0; 
    pointer-events: none; 
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
    z-index: 50; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: #dc2626; color: #fca5a5; }
</style>
</head>
<body>

<!-- Ambient Lighting Effects -->
<div class="ambient-blob blob-1"></div>
<div class="ambient-blob blob-2"></div>
<div class="ambient-blob blob-3"></div>

<div class="topbar">
  <div class="brand-container">
    <div class="logo-3d">
      <span class="logo-3d-text">3D</span>
    </div>
    <div class="brand-info">
      <div class="brand-title">PT. GUNINDO TRIMUKTI <span>• MATSUYAMA</span></div>
      <div class="brand-subtitle">Katalog & Database Viewer Unit GLB</div>
    </div>
  </div>
  <div class="conn-status">
    <span class="conn-dot" id="connDot"></span>
    <span id="connText">menghubungkan...</span>
  </div>
</div>

<main>
  <div class="card-container-wrapper">
    <div class="toolbar">
      <input type="text" class="search-box" id="searchAdmin" placeholder="Cari nama unit, phase, atau ID...">
      <div style="display: flex; gap: 10px; align-items: center;">
        <span class="stat" id="adminStat">0 unit</span>
        <button class="btn-refresh" id="refreshBtn">Muat Ulang</button>
      </div>
    </div>
    
    <div class="units-grid" id="adminCardsContainer"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzioVwXBW4Cyj7nmJ665Evo62EHWXluf1_oxmGCf8S48YxZF2pMsc6MJs74kbV5flkCAg/exec"; 

let units = [];

const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
function setConn(state, text) {
  connDot.className = 'conn-dot' + (state === 'ok' ? ' ok' : state === 'pending' ? ' pending' : '');
  connText.textContent = text;
}

function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.className = 'toast', 3000);
}

async function fetchUnits() {
  setConn('pending', 'menghubungkan...');
  try {
    const res = await fetch(APP_SCRIPT_URL);
    const json = await res.json();
    units = (Array.isArray(json) ? json : []).filter(r => r.id);
    setConn('ok', units.length + ' unit terhubung');
    renderAdmin();
  } catch (e) {
    setConn('', 'gagal: ' + e.message);
  }
}

function renderAdmin() {
  const q = document.getElementById('searchAdmin').value.toLowerCase();
  const filtered = units.filter(u => 
    !q || u.nama_unit.toLowerCase().includes(q) || u.phase.toLowerCase().includes(q) || u.id.toLowerCase().includes(q)
  );
  
  document.getElementById('adminStat').textContent = units.length + ' unit';
  const container = document.getElementById('adminCardsContainer');
  container.innerHTML = '';

  if (filtered.length === 0) {
    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: var(--ink-muted); font-size: 14px;">Tidak ada unit ditemukan.</div>`;
    return;
  }
  
  filtered.forEach(u => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `
      <div>
        <div class="unit-card-header">
          <span class="unit-id">${u.id}</span>
          <span class="badge">${u.phase}</span>
        </div>
        <div class="unit-name">${u.nama_unit}</div>
      </div>
      <div>
        <div class="unit-url-box" title="${u.link}">${u.link}</div>
      </div>
      <div class="unit-footer">
        <div class="btn-action-group">
          <button class="btn-open" onclick="openViewerTab('${u.id}')">
            🌐 Buka
          </button>
          <button class="btn-share" onclick="shareUnitViewer('${u.id}', '${encodeURIComponent(u.nama_unit)}')">
            📤 Bagikan
          </button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function getViewerUrl(id) {
  const encryptedToken = btoa(id);
  const currentUrl = window.location.href;
  
  // Mengambil direktori dasar dari URL saat ini
  const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
  
  // Menambahkan folder viewer/ diakhiri dengan garis miring (/)
  return baseUrl + 'viewer/?token=' + encryptedToken;
}

function openViewerTab(id) {
  const viewerUrl = getViewerUrl(id);
  window.open(viewerUrl, '_blank');
}

async function shareUnitViewer(id, encodedNamaUnit) {
  const namaUnit = decodeURIComponent(encodedNamaUnit);
  const viewerUrl = getViewerUrl(id);
  
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'Viewer 3D — ' + namaUnit,
        text: 'Halo, berikut link Viewer 3D interaktif untuk unit ' + namaUnit + ':',
        url: viewerUrl,
      });
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.log('Sharing error:', err);
      }
    }
  } else {
    try {
      await navigator.clipboard.writeText(viewerUrl);
      showToast('Link viewer berhasil disalin ke clipboard!');
    } catch (err) {
      showToast('Gagal membagikan link.', true);
    }
  }
}

document.getElementById('refreshBtn').addEventListener('click', fetchUnits);
document.getElementById('searchAdmin').addEventListener('input', renderAdmin);

// Memuat data saat pertama kali halaman dibuka
fetchUnits();
</script>
</body>
</html>
