<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Dashboard — PT. GUNINDO TRIMUKTI (MATSUYAMA)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-light: #f4f6fb;
    --panel-bg: #ffffff;
    --panel-raised: #f8fafc;
    --glass-border: rgba(37, 99, 235, 0.12);
    --glass-border-hover: rgba(37, 99, 235, 0.35);
    
    --blue-main: #1d4ed8;
    --blue-accent: #2563eb;
    --cyan-glow: #0891b2;
    --purple-accent: #7c3aed;
    
    --ink-primary: #0f172a;
    --ink-secondary: #475569;
    --ink-muted: #94a3b8;
    
    --accent-gold: #d97706;
    --danger: #dc2626;
    --ok: #059669;
    
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
    
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
  }

  * { box-sizing: inherit; }
  
  html, body { 
    height: 100%; 
    margin: 0; 
    background-color: var(--bg-light); 
    color: var(--ink-primary);
    overflow-x: hidden;
  }

  body { 
    display: flex; 
    flex-direction: column; 
    min-height: 100vh;
    position: relative;
    background-image: 
      radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(124, 58, 237, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(8, 145, 178, 0.08) 0%, transparent 60%);
    background-attachment: fixed;
  }

  /* Decorative Ambient Blobs */
  .ambient-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: -1;
    opacity: 0.6;
    pointer-events: none;
    animation: float 18s infinite ease-in-out alternate;
  }
  .blob-1 { top: -80px; left: -80px; width: 400px; height: 400px; background: rgba(59, 130, 246, 0.2); }
  .blob-2 { bottom: -80px; right: -80px; width: 450px; height: 450px; background: rgba(139, 92, 246, 0.15); animation-delay: -5s; }
  .blob-3 { top: 45%; left: 35%; width: 300px; height: 300px; background: rgba(6, 182, 212, 0.12); animation-delay: -9s; }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, 20px) scale(1.05); }
    100% { transform: translate(-20px, 40px) scale(0.95); }
  }

  /* Topbar Styling */
  .topbar { 
    padding: 16px 32px; 
    border-bottom: 1px solid var(--glass-border); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    background: rgba(255, 255, 255, 0.8); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
  }

  .brand-container {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* 3D Icon Badge */
  .logo-3d {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #7c3aed 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
      0 8px 20px rgba(37, 99, 235, 0.3),
      inset 0 2px 3px rgba(255, 255, 255, 0.5),
      inset 0 -3px 6px rgba(0, 0, 0, 0.2);
    position: relative;
    transform: perspective(400px) rotateX(10deg) rotateY(-10deg);
    transition: transform 0.3s ease;
  }
  .logo-3d:hover {
    transform: perspective(400px) rotateX(0deg) rotateY(0deg) scale(1.05);
  }
  .logo-3d-text {
    font-weight: 800;
    font-size: 13px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    letter-spacing: -0.5px;
  }

  .brand-info { display: flex; flex-direction: column; }
  .brand-title { font-size: 16px; font-weight: 700; color: var(--ink-primary); letter-spacing: -0.2px; }
  .brand-title span { background: linear-gradient(90deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-subtitle { font-size: 10px; color: var(--ink-secondary); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }

  .conn-status { 
    font-family: 'JetBrains Mono', monospace; 
    font-size: 12px; 
    color: var(--ink-secondary); 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    background: rgba(255, 255, 255, 0.9);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .conn-dot { 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    background: var(--danger); 
    box-shadow: 0 0 8px var(--danger);
  }
  .conn-dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .conn-dot.pending { background: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); animation: pulse 1.5s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Main Layout */
  main { flex: 1 1 auto; overflow-y: auto; padding: 28px 32px; }
  .admin-grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 960px) { .admin-grid { grid-template-columns: 1fr; } main { padding: 18px; } }

  /* Cards Styling */
  .card { 
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); 
    border-radius: var(--radius-lg); 
    padding: 24px; 
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.06);
    transition: all 0.3s ease;
  }
  .card:hover { border-color: var(--glass-border-hover); box-shadow: 0 15px 35px rgba(37, 99, 235, 0.1); }

  .card h2 { 
    font-size: 15px; 
    font-weight: 700; 
    margin: 0 0 18px; 
    color: var(--ink-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .id-tag { 
    font-family: 'JetBrains Mono', monospace; 
    color: var(--blue-main); 
    background: rgba(37, 99, 235, 0.08);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    border: 1px solid rgba(37, 99, 235, 0.2);
  }

  /* Form Elements */
  .form-row { margin-bottom: 16px; }
  label { font-size: 12px; font-weight: 700; color: var(--ink-secondary); display: block; margin-bottom: 6px; }
  input[type=text] { 
    background: #ffffff; 
    border: 1px solid #cbd5e1; 
    color: var(--ink-primary); 
    padding: 11px 14px; 
    border-radius: var(--radius-md); 
    font-size: 13.5px; 
    width: 100%; 
    outline: none; 
    transition: all 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  input[type=text]:focus { 
    border-color: var(--blue-accent); 
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  input[type=text]::placeholder { color: var(--ink-muted); }

  /* Buttons */
  .btn { 
    border: none; 
    padding: 11px 18px; 
    border-radius: var(--radius-md); 
    font-weight: 600; 
    font-size: 13.5px; 
    cursor: pointer; 
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary { 
    background: linear-gradient(135deg, var(--blue-accent) 0%, var(--purple-accent) 100%); 
    color: #ffffff; 
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
  }
  .btn-primary:hover:not(:disabled) { 
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    filter: brightness(1.05);
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .btn-ghost { 
    background: #f1f5f9; 
    color: var(--ink-secondary); 
    border: 1px solid #cbd5e1; 
  }
  .btn-ghost:hover { 
    background: #e2e8f0; 
    color: var(--ink-primary);
    border-color: #94a3b8;
  }
  .form-actions { display: flex; gap: 10px; margin-top: 8px; }

  /* Toolbar */
  .toolbar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1 1 220px; }
  .stat { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--blue-main); background: rgba(37, 99, 235, 0.08); padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid rgba(37, 99, 235, 0.2); font-weight: 600; }

  /* Unit Cards Grid Layout */
  .units-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    max-height: calc(100vh - 220px);
    overflow-y: auto;
    padding-right: 4px;
  }

  .unit-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    position: relative;
    overflow: hidden;
  }

  .unit-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: linear-gradient(to bottom, var(--blue-accent), var(--purple-accent));
    opacity: 0.8;
  }

  .unit-card:hover {
    transform: translateY(-3px);
    border-color: var(--blue-accent);
    box-shadow: 0 10px 20px rgba(37, 99, 235, 0.1);
  }

  .unit-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .unit-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--blue-main);
    font-weight: 700;
  }

  .unit-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-primary);
    margin-top: 2px;
    line-height: 1.3;
  }

  .unit-url-box {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    background: var(--panel-raised);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid #e2e8f0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .unit-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #f1f5f9;
    padding-top: 10px;
    margin-top: 2px;
  }

  .actions { display: flex; gap: 6px; }
  .icon-btn { 
    background: #f8fafc; 
    border: 1px solid #cbd5e1; 
    color: var(--ink-secondary); 
    cursor: pointer; 
    font-size: 13px; 
    padding: 6px 10px; 
    border-radius: var(--radius-sm); 
    transition: all 0.2s ease;
  }
  .icon-btn:hover { background: #e2e8f0; color: var(--ink-primary); transform: translateY(-1px); border-color: #94a3b8; }
  .icon-btn.danger:hover { background: rgba(220, 38, 38, 0.1); color: var(--danger); border-color: rgba(220, 38, 38, 0.3); }
  .icon-btn.share:hover { background: rgba(37, 99, 235, 0.1); color: var(--blue-accent); border-color: rgba(37, 99, 235, 0.3); }
  
  .badge { 
    font-family: 'JetBrains Mono', monospace; 
    font-size: 11px; 
    padding: 3px 10px; 
    border-radius: 12px; 
    background: rgba(124, 58, 237, 0.08); 
    border: 1px solid rgba(124, 58, 237, 0.2); 
    color: #7c3aed; 
    font-weight: 600;
  }

  /* Toast Notification */
  .toast { 
    position: fixed; 
    bottom: 24px; 
    left: 50%; 
    transform: translateX(-50%) translateY(20px); 
    background: rgba(15, 23, 42, 0.92); 
    backdrop-filter: blur(12px);
    border: 1px solid var(--blue-accent); 
    color: #fff;
    padding: 12px 22px; 
    border-radius: 30px; 
    font-size: 13.5px; 
    font-weight: 500;
    opacity: 0; 
    pointer-events: none; 
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
    z-index: 50; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); color: #fca5a5; }
  .add-error { font-size: 12px; color: var(--danger); min-height: 16px; margin-top: 6px; font-weight: 600; }
</style>
</head>
<body>

<!-- Ambient Lighting Effects -->
<div class="ambient-blob blob-1"></div>
<div class="ambient-blob blob-2"></div>
<div class="ambient-blob blob-3"></div>

<div class="topbar">
  <div class="brand-container">
    <div class="logo-3d">
      <span class="logo-3d-text">3D</span>
    </div>
    <div class="brand-info">
      <div class="brand-title">PT. GUNINDO TRIMUKTI <span>• MATSUYAMA</span></div>
      <div class="brand-subtitle">Database Management System Unit GLB</div>
    </div>
  </div>
  <div class="conn-status">
    <span class="conn-dot" id="connDot"></span>
    <span id="connText">menghubungkan...</span>
  </div>
</div>

<main>
  <div class="admin-grid">
    <!-- Form Section -->
    <div class="card">
      <h2 id="formTitle">Tambah unit baru</h2>
      <div class="form-row">
        <label>Nama Unit</label>
        <input id="f-name" type="text" placeholder="mis. Tipe 36 / AVR-10KVA">
      </div>
      <div class="form-row">
        <label>Phase</label>
        <input id="f-phase" type="text" placeholder="mis. Phase 1 / 3-Phase">
      </div>
      <div class="form-row">
        <label>Link Dropbox (.glb)</label>
        <input id="f-url" type="text" placeholder="https://www.dropbox.com/s/xxxx/model.glb?dl=0">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="saveBtn">Simpan Unit</button>
        <button class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Batal Edit</button>
      </div>
      <div class="add-error" id="addError"></div>
    </div>

    <!-- Data Cards Section -->
    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchAdmin" placeholder="Cari nama unit, phase, atau ID...">
        <button class="btn btn-ghost" id="refreshBtn">Muat Ulang</button>
        <span class="stat" id="adminStat">0 unit</span>
      </div>
      <div class="units-grid" id="adminCardsContainer"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzioVwXBW4Cyj7nmJ665Evo62EHWXluf1_oxmGCf8S48YxZF2pMsc6MJs74kbV5flkCAg/exec"; 
const SECRET = "Gunindo"; 

let units = [];
let editingId = null;

const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
function setConn(state, text) {
  connDot.className = 'conn-dot' + (state === 'ok' ? ' ok' : state === 'pending' ? ' pending' : '');
  connText.textContent = text;
}

function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.className = 'toast', 3000);
}

async function fetchUnits() {
  setConn('pending', 'menghubungkan...');
  try {
    const res = await fetch(APP_SCRIPT_URL);
    const json = await res.json();
    units = (Array.isArray(json) ? json : []).filter(r => r.id);
    setConn('ok', units.length + ' unit terhubung');
    renderAdmin();
  } catch (e) {
    setConn('', 'gagal: ' + e.message);
  }
}

async function postAction(payload) {
  const res = await fetch(APP_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ secret: SECRET }, payload))
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

function nextId(list) {
  let max = 0;
  list.forEach(u => {
    const m = /^UNIT-(\d+)$/.exec(u.id || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'UNIT-' + String(max + 1).padStart(4, '0');
}

function renderAdmin() {
  const q = document.getElementById('searchAdmin').value.toLowerCase();
  const filtered = units.filter(u => 
    !q || u.nama_unit.toLowerCase().includes(q) || u.phase.toLowerCase().includes(q) || u.id.toLowerCase().includes(q)
  );
  
  document.getElementById('adminStat').textContent = units.length + ' unit';
  const container = document.getElementById('adminCardsContainer');
  container.innerHTML = '';

  if (filtered.length === 0) {
    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--ink-muted); font-size: 13.5px;">Tidak ada unit ditemukan.</div>`;
    return;
  }
  
  filtered.forEach(u => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `
      <div>
        <div class="unit-card-header">
          <span class="unit-id">${u.id}</span>
          <span class="badge">${u.phase}</span>
        </div>
        <div class="unit-name">${u.nama_unit}</div>
      </div>
      <div>
        <div class="unit-url-box" title="${u.link}">${u.link}</div>
      </div>
      <div class="unit-footer">
        <span style="font-size: 11px; color: var(--ink-muted);">Aksi Cepat</span>
        <div class="actions">
          <button class="icon-btn share" title="Copy Link Viewer" onclick="copyViewerLink('${u.id}')">🔗 Link</button>
          <button class="icon-btn" title="Edit" onclick="startEdit('${u.id}')">✎ Edit</button>
          <button class="icon-btn danger" title="Hapus" onclick="deleteUnit('${u.id}')">🗑</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

async function copyViewerLink(id) {
  const currentUrl = window.location.href;
  const baseUrl = currentUrl.substring(0, currentUrl.indexOf('/admin/'));
  const viewerUrl = baseUrl + '/viewer/?id=' + id;
  
  try {
    await navigator.clipboard.writeText(viewerUrl);
    showToast('Link model berhasil disalin!');
  } catch (err) {
    showToast('Gagal menyalin link.', true);
  }
}

const saveBtn = document.getElementById('saveBtn');
saveBtn.addEventListener('click', async () => {
  const fName = document.getElementById('f-name').value;
  const fPhase = document.getElementById('f-phase').value;
  const fUrl = document.getElementById('f-url').value;
  if(!fUrl) return alert("Link Dropbox wajib diisi!");

  saveBtn.disabled = true;
  saveBtn.textContent = 'Menyimpan...';
  try {
    if(editingId) {
      await postAction({ action: 'update', id: editingId, data: { id: editingId, nama_unit: fName, phase: fPhase, link: fUrl } });
      showToast('Unit diperbarui.');
    } else {
      const id = nextId(units);
      await postAction({ action: 'add', data: { id, nama_unit: fName || 'Unit Baru', phase: fPhase, link: fUrl } });
      showToast('Unit ditambahkan.');
    }
    await fetchUnits();
    cancelEdit();
  } catch(e) {
    document.getElementById('addError').textContent = e.message;
  }
  saveBtn.disabled = false;
  saveBtn.textContent = 'Simpan Unit';
});

function startEdit(id) {
  const u = units.find(x => x.id === id);
  if(!u) return;
  editingId = id;
  document.getElementById('f-name').value = u.nama_unit;
  document.getElementById('f-phase').value = u.phase;
  document.getElementById('f-url').value = u.link;
  document.getElementById('formTitle').innerHTML = 'Edit <span class="id-tag">' + id + '</span>';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
}

function cancelEdit() {
  editingId = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-phase').value = '';
  document.getElementById('f-url').value = '';
  document.getElementById('formTitle').textContent = 'Tambah unit baru';
  document.getElementById('cancelEditBtn').style.display = 'none';
}
document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
document.getElementById('refreshBtn').addEventListener('click', fetchUnits);
document.getElementById('searchAdmin').addEventListener('input', renderAdmin);

async function deleteUnit(id) {
  if(!confirm('Hapus unit ' + id + '?')) return;
  try {
    await postAction({ action: 'delete', id });
    showToast('Unit dihapus');
    fetchUnits();
  } catch(e) { showToast('Gagal hapus', true); }
}

fetchUnits();
</script>
</body>
</html>
