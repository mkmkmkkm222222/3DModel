<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Database Unit GLB</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141416; --panel: #1b1c1f; --panel-raised: #222327; --line: #302f33;
    --ink: #ece9e4; --ink-dim: #9a978f; --accent: #e8a33d; --accent-dim: #7a5a26;
    --danger: #d9704f; --ok: #7fb37a; --radius: 3px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f0ec; --panel: #ffffff; --panel-raised: #f7f5f1; --line: #ddd9d1;
      --ink: #201f1c; --ink-dim: #6b675f; --accent: #b5731a; --accent-dim: #e6cba0;
    }
  }
  * { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  body { display: flex; flex-direction: column; overflow: hidden; }

  .topbar { padding: 14px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  .brand { font-size: 15px; font-weight: 600; }
  .brand span { color: var(--accent); }
  .conn-status { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .conn-dot.ok { background: var(--ok); }
  .conn-dot.pending { background: var(--accent); }

  main { flex: 1 1 auto; overflow-y: auto; padding: 24px; }
  .admin-grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .admin-grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px; }
  .card h2 .id-tag { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-weight: 500; }
  
  .form-row { margin-bottom: 12px; }
  label { font-size: 11px; color: var(--ink-dim); display: block; margin-bottom: 4px; }
  input { background: var(--panel-raised); border: 1px solid var(--line); color: var(--ink); padding: 9px 10px; border-radius: var(--radius); font-size: 13px; width: 100%; outline: none; }
  input:focus { border-color: var(--accent); }
  
  .btn { border: none; padding: 9px 14px; border-radius: var(--radius); font-weight: 600; font-size: 13px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #1a1409; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: var(--panel-raised); color: var(--ink); border: 1px solid var(--line); }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .toolbar input[type=text] { flex: 1 1 200px; }
  .stat { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-dim); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; color: var(--ink-dim); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); }
  td.id { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); }
  td.url { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-dim); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 6px; }
  .icon-btn { background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 14px; padding: 4px 6px; border-radius: var(--radius); }
  .icon-btn:hover { background: var(--panel-raised); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn.share:hover { color: var(--accent); }
  .badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--panel-raised); border: 1px solid var(--line); color: var(--ink-dim); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-raised); border: 1px solid var(--line); padding: 10px 16px; border-radius: var(--radius); font-size: 13px; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 50; }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .add-error { font-size: 12px; color: var(--danger); min-height: 14px; margin-top: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Admin<span>.</span> Database Unit GLB</div>
  <div class="conn-status"><span class="conn-dot" id="connDot"></span><span id="connText">menghubungkan...</span></div>
</div>

<main>
  <div class="admin-grid">
    <div class="card">
      <h2 id="formTitle">Tambah unit baru</h2>
      <div class="form-row"><label>Nama unit</label><input id="f-name" type="text" placeholder="mis. Tipe 36"></div>
      <div class="form-row"><label>Phase</label><input id="f-phase" type="text" placeholder="mis. Phase 1"></div>
      <div class="form-row"><label>Link Dropbox (.glb)</label><input id="f-url" type="text" placeholder="https://www.dropbox.com/s/xxxx/model.glb?dl=0"></div>
      <div class="form-actions">
        <button class="btn btn-primary" id="saveBtn">Simpan unit</button>
        <button class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Batal edit</button>
      </div>
      <div class="add-error" id="addError"></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchAdmin" placeholder="Cari nama unit, phase, atau ID...">
        <button class="btn btn-ghost" id="refreshBtn">Muat ulang</button>
        <span class="stat" id="adminStat">0 unit</span>
      </div>
      <table>
        <thead><tr><th>ID</th><th>Nama unit</th><th>Phase</th><th>Link</th><th>Aksi</th></tr></thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzioVwXBW4Cyj7nmJ665Evo62EHWXluf1_oxmGCf8S48YxZF2pMsc6MJs74kbV5flkCAg/exec"; 
const SECRET = "Gunindo"; 

let units = [];
let editingId = null;

const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
function setConn(state, text) {
  connDot.className = 'conn-dot' + (state === 'ok' ? ' ok' : state === 'pending' ? ' pending' : '');
  connText.textContent = text;
}

function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.className = 'toast', 3000);
}

async function fetchUnits() {
  setConn('pending', 'menghubungkan...');
  try {
    const res = await fetch(APP_SCRIPT_URL);
    const json = await res.json();
    units = (Array.isArray(json) ? json : []).filter(r => r.id);
    setConn('ok', units.length + ' unit terhubung');
    renderAdmin();
  } catch (e) {
    setConn('', 'gagal: ' + e.message);
  }
}

async function postAction(payload) {
  const res = await fetch(APP_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ secret: SECRET }, payload))
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

function nextId(list) {
  let max = 0;
  list.forEach(u => {
    const m = /^UNIT-(\d+)$/.exec(u.id || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'UNIT-' + String(max + 1).padStart(4, '0');
}

function renderAdmin() {
  const q = document.getElementById('searchAdmin').value.toLowerCase();
  const filtered = units.filter(u => 
    !q || u.nama_unit.toLowerCase().includes(q) || u.phase.toLowerCase().includes(q) || u.id.toLowerCase().includes(q)
  );
  
  document.getElementById('adminStat').textContent = units.length + ' unit';
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '';
  
  filtered.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="id">${u.id}</td>
      <td style="font-weight:500;">${u.nama_unit}</td>
      <td><span class="badge">${u.phase}</span></td>
      <td class="url" title="${u.link}">${u.link}</td>
      <td class="actions">
        <button class="icon-btn share" title="Copy Link Viewer" onclick="copyViewerLink('${u.id}')">🔗</button>
        <button class="icon-btn" title="Edit" onclick="startEdit('${u.id}')">✎</button>
        <button class="icon-btn danger" title="Hapus" onclick="deleteUnit('${u.id}')">🗑</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function copyViewerLink(id) {
  // Mengarah ke file viewer.html dengan parameter ID
  const viewerUrl = new URL('viewer.html?id=' + id, window.location.href).href;
  try {
    await navigator.clipboard.writeText(viewerUrl);
    showToast('Link model berhasil disalin!');
  } catch (err) {
    showToast('Gagal menyalin link.', true);
  }
}

const saveBtn = document.getElementById('saveBtn');
saveBtn.addEventListener('click', async () => {
  const fName = document.getElementById('f-name').value;
  const fPhase = document.getElementById('f-phase').value;
  const fUrl = document.getElementById('f-url').value;
  if(!fUrl) return alert("Link Dropbox wajib diisi!");

  saveBtn.disabled = true;
  saveBtn.textContent = 'Menyimpan...';
  try {
    if(editingId) {
      await postAction({ action: 'update', id: editingId, data: { id: editingId, nama_unit: fName, phase: fPhase, link: fUrl } });
      showToast('Unit diperbarui.');
    } else {
      const id = nextId(units);
      await postAction({ action: 'add', data: { id, nama_unit: fName || 'Unit Baru', phase: fPhase, link: fUrl } });
      showToast('Unit ditambahkan.');
    }
    await fetchUnits();
    cancelEdit();
  } catch(e) {
    document.getElementById('addError').textContent = e.message;
  }
  saveBtn.disabled = false;
  saveBtn.textContent = 'Simpan unit';
});

function startEdit(id) {
  const u = units.find(x => x.id === id);
  if(!u) return;
  editingId = id;
  document.getElementById('f-name').value = u.nama_unit;
  document.getElementById('f-phase').value = u.phase;
  document.getElementById('f-url').value = u.link;
  document.getElementById('formTitle').innerHTML = 'Edit <span class="id-tag">' + id + '</span>';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
}

function cancelEdit() {
  editingId = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-phase').value = '';
  document.getElementById('f-url').value = '';
  document.getElementById('formTitle').textContent = 'Tambah unit baru';
  document.getElementById('cancelEditBtn').style.display = 'none';
}
document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
document.getElementById('refreshBtn').addEventListener('click', fetchUnits);
document.getElementById('searchAdmin').addEventListener('input', renderAdmin);

async function deleteUnit(id) {
  if(!confirm('Hapus unit ' + id + '?')) return;
  try {
    await postAction({ action: 'delete', id });
    showToast('Unit dihapus');
    fetchUnits();
  } catch(e) { showToast('Gagal hapus', true); }
}

fetchUnits();
</script>
</body>
</html>
