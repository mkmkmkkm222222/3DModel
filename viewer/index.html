<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Viewer v.05</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://dl.dropboxusercontent.com">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body, html { margin: 0; padding: 0; height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: #141416; color: #ece9e4; overflow: hidden; }

  .header {
    position: absolute; top: 0; left: 0; right: 0; padding: 15px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    z-index: 10; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start;
  }
  .unit-info h1 { margin: 0; font-size: 18px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .unit-info p { margin: 4px 0 0; font-size: 13px; color: #9a978f; }
  .badge { background: #e8a33d; color: #1a1409; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }

  model-viewer { width: 100%; height: 100%; --poster-color: transparent; --progress-bar-color: #e8a33d; }

  .loading-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #141416; z-index: 20; flex-direction: column; gap: 10px;}
  .spin { width: 30px; height: 30px; border: 3px solid #302f33; border-top-color: #e8a33d; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: #d9704f; font-size: 14px; text-align: center; padding: 20px; display: none; }

  .controls {
    position: absolute; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 10; display: none; flex-direction: column; gap: 8px;
  }
  .controls button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #302f33;
    background: rgba(30,30,34,0.85); color: #ece9e4; font-size: 20px; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .controls button:active { background: #e8a33d; color: #1a1409; }
</style>
</head>
<body>

<div class="header" id="header" style="display:none;">
  <div class="unit-info">
    <h1 id="unitName">Memuat...</h1>
    <p id="unitId"></p>
  </div>
  <div class="badge" id="unitPhase"></div>
</div>

<div class="loading-screen" id="loading">
  <div class="spin" id="spinner"></div>
  <div class="error-msg" id="errorMsg"></div>
</div>

<div class="controls" id="controls">
  <button id="btnIn" aria-label="Zoom in">+</button>
  <button id="btnOut" aria-label="Zoom out">−</button>
  <button id="btnFit" aria-label="Fit ke layar">⤢</button>
</div>

<model-viewer
  id="viewer"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1"
  min-camera-orbit="auto auto 1%"
  max-camera-orbit="auto auto 500%"
  crossorigin="anonymous"
  ar
  ar-scale="fixed"
  ar-modes="webxr scene-viewer quick-look"></model-viewer>

<script>
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzioVwXBW4Cyj7nmJ665Evo62EHWXluf1_oxmGCf8S48YxZF2pMsc6MJs74kbV5flkCAg/exec";

// Seberapa penuh unit mengisi layar. 1.0 = pas satu sisi terpanjang menyentuh tepi.
// Naikkan (mis. 1.5) untuk lebih dekat, turunkan (mis. 0.8) untuk lebih jauh.
const FILL = 1.2;

// Persentase titik terluar yang diabaikan di tiap sisi (untuk membuang objek nyasar).
// 0.005 = 0.5%. Naikkan (mis. 0.02) kalau masih kecil, turunkan ke 0 untuk menonaktifkan.
const TRIM = 0.005;

function toDirectDropboxUrl(raw) {
  let url;
  try { url = new URL(String(raw).trim()); } catch (e) { return ''; }
  const host = url.hostname.replace('www.', '');
  if (host === 'dropbox.com' || host === 'dl.dropboxusercontent.com') {
    if (host === 'dropbox.com') url.hostname = 'dl.dropboxusercontent.com';
    url.searchParams.delete('dl');
    url.searchParams.set('raw', '1');
    return url.toString();
  }
  return url.toString();
}

// Hitung batas model dari titik geometri sebenarnya, abaikan titik yang terlalu jauh (outlier)
function getTrimmedBounds(viewer) {
  try {
    const sym = Object.getOwnPropertySymbols(viewer).find(s => s.description === 'scene');
    const scene = sym && viewer[sym];
    if (!scene) return null;
    const root = scene.model || scene;
    scene.updateMatrixWorld(true);

    // Hitung total titik untuk menentukan lompatan sampling
    let total = 0;
    root.traverse(o => {
      if (o.isMesh && o.geometry && o.geometry.attributes.position) total += o.geometry.attributes.position.count;
    });
    if (total < 10) return null;
    const stride = Math.max(1, Math.ceil(total / 300000));

    const xs = [], ys = [], zs = [];
    root.traverse(o => {
      if (!o.isMesh || !o.geometry) return;
      const pos = o.geometry.attributes.position;
      if (!pos) return;
      const e = o.matrixWorld.elements;
      for (let i = 0; i < pos.count; i += stride) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        xs.push(e[0]*x + e[4]*y + e[8]*z  + e[12]);
        ys.push(e[1]*x + e[5]*y + e[9]*z  + e[13]);
        zs.push(e[2]*x + e[6]*y + e[10]*z + e[14]);
      }
    });

    const range = arr => {
      arr.sort((a, b) => a - b);
      const n = arr.length;
      const lo = arr[Math.floor(n * TRIM)];
      const hi = arr[Math.min(n - 1, Math.floor(n * (1 - TRIM)))];
      return [lo, hi];
    };
    const [x0, x1] = range(xs), [y0, y1] = range(ys), [z0, z1] = range(zs);
    return {
      size:   { x: x1 - x0, y: y1 - y0, z: z1 - z0 },
      center: { x: (x0 + x1) / 2, y: (y0 + y1) / 2, z: (z0 + z1) / 2 }
    };
  } catch (e) {
    console.warn('getTrimmedBounds gagal, pakai cara biasa:', e);
    return null;
  }
}

function fitModel(viewer) {
  let b = getTrimmedBounds(viewer);
  if (!b) b = { size: viewer.getDimensions(), center: viewer.getBoundingBoxCenter() };

  const size = b.size, c = b.center;
  const maxDim = Math.max(size.x, size.y, size.z);
  if (!maxDim || !isFinite(maxDim)) return;

  const fovDeg = viewer.getFieldOfView ? viewer.getFieldOfView() : 45;
  const halfFov = (fovDeg * Math.PI) / 360;
  let radius = (maxDim / 2) / Math.tan(halfFov) / FILL;

  // Layar potret (HP): lebar jadi pembatas, jadi kamera perlu sedikit lebih jauh
  const aspect = viewer.clientWidth / viewer.clientHeight;
  if (aspect && aspect < 1) radius /= aspect;

  console.log('Dimensi model (setelah trim):', size.x, size.y, size.z, '| radius:', radius);

  viewer.cameraTarget = `${c.x}m ${c.y}m ${c.z}m`;
  viewer.cameraOrbit = `30deg 72deg ${radius}m`;
  viewer.jumpCameraToGoal();
}

function zoom(viewer, factor) {
  const o = viewer.getCameraOrbit();
  viewer.cameraOrbit = `${o.theta}rad ${o.phi}rad ${o.radius * factor}m`;
}

async function loadModel() {
  const urlParams = new URLSearchParams(window.location.search);
  let targetId = urlParams.get('id');

  // Simpan ID sementara supaya refresh halaman tetap bisa memuat unit yang sama
  try {
    if (targetId) sessionStorage.setItem('unitId', targetId);
    else targetId = sessionStorage.getItem('unitId');
  } catch (e) {}

  if (!targetId) {
    showError("URL tidak valid. ID Unit tidak ditemukan.");
    return;
  }

  // Bersihkan ?id=... dari address bar
  window.history.replaceState(null, '', window.location.pathname);

  try {
    const res = await fetch(APP_SCRIPT_URL);
    const data = await res.json();

    const unit = data.find(u => u.id === targetId);

    if (unit) {
      document.getElementById('unitName').textContent = unit.nama_unit;
      document.getElementById('unitId').textContent = unit.id;
      document.getElementById('unitPhase').textContent = unit.phase;
      document.getElementById('header').style.display = 'flex';

      const viewer = document.getElementById('viewer');

      viewer.addEventListener('load', () => {
        // Tunggu satu frame supaya model benar-benar siap
        requestAnimationFrame(() => {
          fitModel(viewer);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('controls').style.display = 'flex';
        });
      });
      viewer.addEventListener('error', () => {
        showError("Gagal memuat model 3D. Pastikan link Dropbox publik.");
      });

      document.getElementById('btnIn').onclick  = () => zoom(viewer, 0.7);
      document.getElementById('btnOut').onclick = () => zoom(viewer, 1.4);
      document.getElementById('btnFit').onclick = () => fitModel(viewer);

      viewer.src = toDirectDropboxUrl(unit.link);
    } else {
      showError(`Unit dengan ID ${targetId} tidak ditemukan di database.`);
    }
  } catch (err) {
    showError("Gagal terhubung ke database server.");
  }
}

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'block';
  errEl.textContent = msg;
}

loadModel();
</script>
</body>
</html>
