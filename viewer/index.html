<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Viewer v.07</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://dl.dropboxusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  body, html { margin: 0; padding: 0; height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: #141416; color: #ece9e4; overflow: hidden; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .header {
    position: absolute; top: 0; left: 0; right: 0; padding: 15px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    z-index: 10; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start;
  }
  .unit-info h1 { margin: 0; font-size: 18px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .unit-info p { margin: 4px 0 0; font-size: 13px; color: #9a978f; }
  .badge { background: #e8a33d; color: #1a1409; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }

  .loading-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #141416; z-index: 20; flex-direction: column; gap: 10px; }
  .spin { width: 30px; height: 30px; border: 3px solid #302f33; border-top-color: #e8a33d; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { font-size: 13px; color: #9a978f; min-height: 16px; }
  .error-msg { color: #d9704f; font-size: 14px; text-align: center; padding: 20px; display: none; }

  .controls {
    position: absolute; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 10; display: none; flex-direction: column; gap: 8px;
  }
  .controls button, .mode button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #302f33;
    background: rgba(30,30,34,0.85); color: #ece9e4; font-size: 20px; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .controls button:active, .mode button:active { background: #e8a33d; color: #1a1409; }

  .mode {
    position: absolute; left: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 10; display: none;
  }
  .mode button {
    width: auto; border-radius: 22px; padding: 0 18px; font-size: 14px; font-weight: 600; gap: 8px;
  }
  .mode button.walk { background: #e8a33d; color: #1a1409; border-color: #e8a33d; }

  .hint {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    z-index: 10; font-size: 12px; color: #ece9e4; background: rgba(20,20,22,0.75);
    padding: 7px 14px; border-radius: 12px; pointer-events: none; display: none;
    transition: opacity .6s; text-align: center; max-width: 86vw;
  }

  /* Joystick virtual (HP) */
  .joy {
    position: absolute; left: 24px; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    width: 120px; height: 120px; border-radius: 50%; z-index: 10; display: none;
    background: rgba(30,30,34,0.55); border: 1px solid #302f33; touch-action: none;
  }
  .joy .knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(232,163,61,0.85);
  }

  /* ---------- Tema putih bersih ---------- */
  body, html { background: #f3f4f6; color: #1f2328; }
  .loading-screen { background: #f3f4f6; }
  .spin { border-color: #d9dce1; border-top-color: #1f2328; }
  .progress { color: #6b7280; }
  .header { background: linear-gradient(to bottom, rgba(255,255,255,0.9), transparent); }
  .unit-info h1 { color: #1f2328; text-shadow: none; }
  .unit-info p { color: #6b7280; letter-spacing: .06em; }
  .badge { background: #1f2328; color: #fff; box-shadow: none; }
  .controls button, .mode button { background: rgba(255,255,255,0.9); border: 1px solid #d9dce1; color: #1f2328; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .controls button:active, .mode button:active { background: #1f2328; color: #fff; }
  .mode button.walk { background: #1f2328; color: #fff; border-color: #1f2328; }
  .hint { background: rgba(255,255,255,0.92); color: #1f2328; border: 1px solid #d9dce1; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .joy { background: rgba(255,255,255,0.6); border: 1px solid #c9cdd3; }
  .joy .knob { background: #1f2328; opacity: .85; }
  .error-msg { color: #b42318; }
</style>
</head>
<body>

<div id="stage"></div>

<div class="header" id="header" style="display:none;">
  <div class="unit-info">
    <h1 id="unitName">Memuat...</h1>
    <p id="unitId"></p>
  </div>
  <div class="badge" id="unitPhase"></div>
</div>

<div class="loading-screen" id="loading">
  <div class="spin" id="spinner"></div>
  <div class="progress" id="progress"></div>
  <div class="error-msg" id="errorMsg"></div>
</div>

<div class="mode" id="mode"><button id="btnMode">Mode jalan</button></div>

<div class="joy" id="joy"><div class="knob" id="knob"></div></div>

<div class="controls" id="controls">
  <button id="btnIn" aria-label="Zoom in">+</button>
  <button id="btnOut" aria-label="Zoom out">−</button>
  <button id="btnFit" aria-label="Kembali ke posisi awal">⤢</button>
</div>

<div class="hint" id="hint"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzioVwXBW4Cyj7nmJ665Evo62EHWXluf1_oxmGCf8S48YxZF2pMsc6MJs74kbV5flkCAg/exec";

// ---------- Pengaturan ----------
// Seberapa penuh unit mengisi layar di mode orbit. Naikkan = lebih dekat.
const FILL = 1.2;
// Tinggi mata di mode jalan (meter). null = otomatis menyesuaikan ukuran unit.
const EYE_HEIGHT = null;
// Kecepatan jalan (meter/detik). null = otomatis menyesuaikan ukuran unit.
const WALK_SPEED = null;
// Kepekaan geser layar untuk menoleh
const LOOK_SENSITIVITY = 0.0035;
// Batas jarak jelajah dari unit (kelipatan ukuran unit)
const MAX_ROAM = 8;

// Senter (aktif di mode jalan)
const FLASH_INTENSITY = 4;          // naikkan = lebih terang
const FLASH_ANGLE = Math.PI / 4;    // lebar sorotan (makin besar makin lebar)
const FLASH_SOFTNESS = 0.6;         // 0 = tepi tegas, 1 = tepi sangat lembut

const isTouch = window.matchMedia('(pointer: coarse)').matches;

// ---------- Utilitas ----------
function toDirectDropboxUrl(raw) {
  let url;
  try { url = new URL(String(raw).trim()); } catch (e) { return ''; }
  const host = url.hostname.replace('www.', '');
  if (host === 'dropbox.com' || host === 'dl.dropboxusercontent.com') {
    if (host === 'dropbox.com') url.hostname = 'dl.dropboxusercontent.com';
    url.searchParams.delete('dl');
    url.searchParams.set('raw', '1');
    return url.toString();
  }
  return url.toString();
}

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('progress').style.display = 'none';
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'block';
  errEl.textContent = msg;
}

// ---------- Scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Latar putih bersih dengan gradasi halus
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 512;
const bgCtx = bgCanvas.getContext('2d');
const grad = bgCtx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0.00, '#ffffff');
grad.addColorStop(0.70, '#eef0f3');
grad.addColorStop(0.71, '#e4e7eb');
grad.addColorStop(1.00, '#dcdfe4');
bgCtx.fillStyle = grad; bgCtx.fillRect(0, 0, 2, 512);
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 6);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8dbe0, 0.8));

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
camera.rotation.order = 'YXZ';

// ---------- Senter ----------
scene.add(camera); // kamera harus ada di scene agar lampu yang menempel ikut tampil
const flashlight = new THREE.SpotLight(0xfff3e0, FLASH_INTENSITY, 0, FLASH_ANGLE, FLASH_SOFTNESS, 0);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1); // menyorot lurus ke depan kamera
camera.add(flashlight);
camera.add(flashlight.target);
flashlight.visible = false;

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.maxPolarAngle = Math.PI * 0.53; // tidak turun ke bawah lantai

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- State ----------
let mode = 'orbit';           // 'orbit' | 'walk'
let modelBox = null;          // Box3 model (setelah diletakkan di lantai)
let center = new THREE.Vector3();
let maxDim = 1;
let eye = 1.6, speed = 2;
let yaw = 0, pitch = 0;

const keys = {};
const joyVec = { x: 0, y: 0 };

// ---------- Kamera ----------
function fitOrbit() {
  const fovRad = THREE.MathUtils.degToRad(camera.fov);
  let dist = (maxDim / 2) / Math.tan(fovRad / 2) / FILL;
  if (camera.aspect < 1) dist /= camera.aspect;
  const theta = THREE.MathUtils.degToRad(30), phi = THREE.MathUtils.degToRad(72);
  camera.position.set(
    center.x + dist * Math.sin(phi) * Math.sin(theta),
    center.y + dist * Math.cos(phi),
    center.z + dist * Math.sin(phi) * Math.cos(theta)
  );
  orbit.target.copy(center);
  orbit.update();
}

function startWalk() {
  // Berdiri di depan unit, menghadap ke tengah unit
  const dist = Math.max(maxDim * 1.1, 2);
  camera.position.set(center.x, eye, modelBox.max.z + dist);
  const dir = new THREE.Vector3().subVectors(center, camera.position);
  yaw = Math.atan2(-dir.x, -dir.z);
  pitch = Math.atan2(dir.y, Math.hypot(dir.x, dir.z)) * 0.5;
  applyLook();
}

function applyLook() {
  pitch = THREE.MathUtils.clamp(pitch, -1.45, 1.45);
  camera.rotation.set(pitch, yaw, 0);
}

function setMode(next) {
  mode = next;
  flashlight.visible = (mode === 'walk');
  const btn = document.getElementById('btnMode');
  const zoomBtns = [document.getElementById('btnIn'), document.getElementById('btnOut')];
  if (mode === 'walk') {
    orbit.enabled = false;
    startWalk();
    btn.textContent = 'Mode putar';
    btn.classList.add('walk');
    zoomBtns.forEach(b => b.style.display = 'none');
    document.getElementById('joy').style.display = isTouch ? 'block' : 'none';
    showHint(isTouch
      ? 'Joystick untuk berjalan · Geser layar untuk menoleh'
      : 'W A S D untuk berjalan · Geser mouse untuk menoleh · Shift = lari · Spasi/C = naik/turun');
  } else {
    orbit.enabled = true;
    fitOrbit();
    btn.textContent = 'Mode jalan';
    btn.classList.remove('walk');
    zoomBtns.forEach(b => b.style.display = 'flex');
    document.getElementById('joy').style.display = 'none';
    showHint('Geser untuk mengitari · Cubit / scroll untuk zoom · Klik kanan / dua jari untuk menggeser');
  }
}

let hintTimer;
function showHint(text) {
  const hint = document.getElementById('hint');
  hint.textContent = text;
  hint.style.display = 'block';
  hint.style.opacity = '1';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    hint.style.opacity = '0';
    setTimeout(() => { hint.style.display = 'none'; }, 700);
  }, 5000);
}

// ---------- Kontrol jalan ----------
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup',   e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// Geser layar / mouse untuk menoleh (mode jalan)
let lookPointer = null, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (mode !== 'walk' || lookPointer !== null) return;
  lookPointer = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (mode !== 'walk' || e.pointerId !== lookPointer) return;
  yaw   -= (e.clientX - lastX) * LOOK_SENSITIVITY;
  pitch -= (e.clientY - lastY) * LOOK_SENSITIVITY;
  lastX = e.clientX; lastY = e.clientY;
  applyLook();
});
const endLook = e => { if (e.pointerId === lookPointer) lookPointer = null; };
renderer.domElement.addEventListener('pointerup', endLook);
renderer.domElement.addEventListener('pointercancel', endLook);

// Joystick virtual
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
let joyPointer = null;
function joyMove(e) {
  const r = joy.getBoundingClientRect();
  const R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  const len = Math.hypot(dx, dy);
  if (len > R) { dx = dx / len * R; dy = dy / len * R; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.x = dx / R;
  joyVec.y = dy / R;
}
joy.addEventListener('pointerdown', e => {
  joyPointer = e.pointerId; joy.setPointerCapture(e.pointerId); joyMove(e);
});
joy.addEventListener('pointermove', e => { if (e.pointerId === joyPointer) joyMove(e); });
const joyEnd = e => {
  if (e.pointerId !== joyPointer) return;
  joyPointer = null; joyVec.x = 0; joyVec.y = 0;
  knob.style.transform = 'translate(0,0)';
};
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);

// Tabrakan sederhana: kamera tidak boleh masuk ke dalam kotak unit
function collide() {
  if (!modelBox) return;
  const m = Math.max(maxDim * 0.03, 0.3);
  const minX = modelBox.min.x - m, maxX = modelBox.max.x + m;
  const minZ = modelBox.min.z - m, maxZ = modelBox.max.z + m;
  const p = camera.position;
  if (p.y > modelBox.max.y + m) return; // di atas unit, bebas lewat
  if (p.x > minX && p.x < maxX && p.z > minZ && p.z < maxZ) {
    const dl = p.x - minX, dr = maxX - p.x, df = p.z - minZ, db = maxZ - p.z;
    const d = Math.min(dl, dr, df, db);
    if (d === dl) p.x = minX;
    else if (d === dr) p.x = maxX;
    else if (d === df) p.z = minZ;
    else p.z = maxZ;
  }
}

const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3();

function updateWalk(dt) {
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp)    f += 1;
  if (keys.KeyS || keys.ArrowDown)  f -= 1;
  if (keys.KeyD || keys.ArrowRight) s += 1;
  if (keys.KeyA || keys.ArrowLeft)  s -= 1;
  f += -joyVec.y;
  s += joyVec.x;

  const len = Math.hypot(f, s);
  if (len > 1) { f /= len; s /= len; }

  const run = (keys.ShiftLeft || keys.ShiftRight) ? 2.5 : 1;
  const v = speed * run * dt;

  fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  camera.position.addScaledVector(fwd, f * v).addScaledVector(right, s * v);

  let up = 0;
  if (keys.Space) up += 1;
  if (keys.KeyC)  up -= 1;
  camera.position.y = Math.max(eye * 0.3, camera.position.y + up * v);

  // Batas jelajah
  const off = new THREE.Vector2(camera.position.x - center.x, camera.position.z - center.z);
  const limit = maxDim * MAX_ROAM;
  if (off.length() > limit) {
    off.setLength(limit);
    camera.position.x = center.x + off.x;
    camera.position.z = center.z + off.y;
  }

  collide();
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mode === 'walk') updateWalk(dt);
  else orbit.update();
  renderer.render(scene, camera);
});

// ---------- Memuat model ----------
function placeModel(gltf) {
  const model = gltf.scene;
  scene.add(model);

  // Letakkan di lantai (y = 0) dan pusatkan di sumbu X/Z
  let box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x;
  model.position.z -= c.z;
  model.position.y -= box.min.y;
  model.updateMatrixWorld(true);

  modelBox = new THREE.Box3().setFromObject(model);
  const size = modelBox.getSize(new THREE.Vector3());
  modelBox.getCenter(center);
  maxDim = Math.max(size.x, size.y, size.z);
  console.log('Dimensi model (m):', size.x, size.y, size.z);

  eye   = EYE_HEIGHT ?? THREE.MathUtils.clamp(maxDim * 0.15, 0.3, 1.6);
  speed = WALK_SPEED ?? THREE.MathUtils.clamp(maxDim * 0.3, 1, 8);

  camera.near = Math.max(maxDim * 0.005, 0.01);
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  orbit.minDistance = maxDim * 0.05;
  orbit.maxDistance = maxDim * MAX_ROAM;

  // Lantai: piringan gelap + grid tipis agar terasa berpijak
  const groundR = maxDim * MAX_ROAM * 1.2;
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(groundR, 64),
    new THREE.MeshStandardMaterial({ color: 0xe4e7eb, roughness: 1, metalness: 0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.001;
  scene.add(ground);

  const grid = new THREE.GridHelper(groundR * 2, Math.round(groundR * 2 / Math.max(maxDim * 0.25, 0.5)), 0xc4c8ce, 0xd6d9de);
  grid.material.transparent = true;
  grid.material.opacity = 0.6;
  scene.fog = new THREE.Fog(0xe6e9ed, groundR * 0.25, groundR * 0.95);
  scene.add(grid);
}

async function loadModel() {
  const urlParams = new URLSearchParams(window.location.search);
  let targetId = urlParams.get('id');

  try {
    if (targetId) sessionStorage.setItem('unitId', targetId);
    else targetId = sessionStorage.getItem('unitId');
  } catch (e) {}

  if (!targetId) {
    showError("URL tidak valid. ID Unit tidak ditemukan.");
    return;
  }

  window.history.replaceState(null, '', window.location.pathname);

  let unit;
  try {
    const res = await fetch(APP_SCRIPT_URL);
    const data = await res.json();
    unit = data.find(u => u.id === targetId);
  } catch (err) {
    showError("Gagal terhubung ke database server.");
    return;
  }

  if (!unit) {
    showError(`Unit dengan ID ${targetId} tidak ditemukan di database.`);
    return;
  }

  document.getElementById('unitName').textContent = unit.nama_unit;
  document.getElementById('unitId').textContent = unit.id;
  document.getElementById('unitPhase').textContent = unit.phase;
  document.getElementById('header').style.display = 'flex';

  const draco = new DRACOLoader();
  draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);

  loader.load(
    toDirectDropboxUrl(unit.link),
    gltf => {
      placeModel(gltf);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('mode').style.display = 'block';
      setMode('orbit');
    },
    xhr => {
      if (xhr.lengthComputable) {
        document.getElementById('progress').textContent = Math.round(xhr.loaded / xhr.total * 100) + '%';
      } else {
        document.getElementById('progress').textContent = (xhr.loaded / 1048576).toFixed(1) + ' MB';
      }
    },
    err => {
      console.error(err);
      showError("Gagal memuat model 3D. Pastikan link Dropbox publik.");
    }
  );
}

// ---------- Tombol ----------
function dolly(factor) {
  const offset = camera.position.clone().sub(orbit.target).multiplyScalar(factor);
  const len = THREE.MathUtils.clamp(offset.length(), orbit.minDistance, orbit.maxDistance);
  camera.position.copy(orbit.target).add(offset.setLength(len));
  orbit.update();
}
document.getElementById('btnIn').onclick  = () => dolly(0.7);
document.getElementById('btnOut').onclick = () => dolly(1.4);
document.getElementById('btnFit').onclick = () => { mode === 'walk' ? startWalk() : fitOrbit(); };
document.getElementById('btnMode').onclick = () => setMode(mode === 'orbit' ? 'walk' : 'orbit');

loadModel();
</script>
</body>
</html>
